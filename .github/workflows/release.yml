name: Release (Drive-Thru)

# Every push to main builds whopper for Windows, Linux and macOS, then
# publishes (or refreshes) the Release for the version in Cargo.toml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Grill for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: Windows
            bin: target/release/whopper.exe
            asset: whopper-windows-x86_64.exe
          - os: ubuntu-latest
            name: Linux
            bin: target/release/whopper
            asset: whopper-linux-x86_64
          - os: macos-latest
            name: macOS
            bin: target/release/whopper
            asset: whopper-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --release
      - name: Rename binary
        shell: bash
        run: cp "${{ matrix.bin }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    name: Serve the order
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version from Cargo.toml
        id: ver
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: whopper v${{ steps.ver.outputs.version }}
          make_latest: true
          body: |
            🍔 Fresh off the grill.

            **Windows:** download `whopper-windows-x86_64.exe` and double-click it.
            If SmartScreen complains, click **More info → Run anyway**. It's just a burger.

            **Linux / macOS:** download your binary, `chmod +x` it, and run it.
          files: whopper-*
