name: Release (Drive-Thru)

# Push a tag like v1.0.0 and GitHub builds whopper.exe and the Linux binary,
# then attaches them to a Release on the repo page.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Grill for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: Windows
            bin: target/release/whopper.exe
            asset: whopper-windows-x86_64.exe
          - os: ubuntu-latest
            name: Linux
            bin: target/release/whopper
            asset: whopper-linux-x86_64
          - os: macos-latest
            name: macOS
            bin: target/release/whopper
            asset: whopper-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --release
      - name: Rename binary
        shell: bash
        run: cp "${{ matrix.bin }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    name: Serve the order
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: whopper ${{ github.ref_name }}
          body: |
            🍔 Fresh off the grill.

            **Windows:** download `whopper-windows-x86_64.exe` and double-click it.
            If SmartScreen complains, click **More info → Run anyway**. It's just a burger.

            **Linux / macOS:** download your binary, `chmod +x` it, and run it.
          files: whopper-*
